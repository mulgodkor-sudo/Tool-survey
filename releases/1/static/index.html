<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Survey - Engineering Hub</title>
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#dfe4ec; --line2:#eef1f6;
  --ink:#1d2430; --ink2:#5b6676; --ink3:#8a95a6;
  --accent:#2563a8; --accent-soft:#e8f0fa;
  --ok:#1f7a4d; --ok-soft:#e6f4ec; --warn:#a8631f; --warn-soft:#fdf2e3;
  --bad:#b03a3a; --bad-soft:#fbeaea;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font-family:"Malgun Gothic","맑은 고딕",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.6}
a{color:var(--accent)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hwrap{max-width:1040px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:12px}
.logo{font-weight:700;font-size:16px;letter-spacing:-.3px}
.logo small{font-weight:400;color:var(--ink3);font-size:12px;margin-left:6px}
.hwrap .sp{flex:1}
.who{color:var(--ink2);font-size:13px}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;
  background:var(--accent-soft);color:var(--accent);margin-left:5px;vertical-align:1px}
main{max-width:1040px;margin:0 auto;padding:20px 18px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 6px}
h2{font-size:16px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line2)}
h3{font-size:14px;margin:18px 0 8px}
p.lead{color:var(--ink2);white-space:pre-wrap;margin:0 0 4px}
.muted{color:var(--ink3);font-size:12.5px}
button{font-family:inherit;font-size:13px;border:1px solid var(--line);background:#fff;
  color:var(--ink);padding:7px 14px;border-radius:7px;cursor:pointer}
button:hover{border-color:#c3ccda;background:#fafbfd}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:#1e5490}
button.ghost{border-color:transparent;background:transparent;color:var(--ink2);padding:5px 8px}
button.danger{color:var(--bad);border-color:#e9cfcf}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
input[type=text],textarea,select{font-family:inherit;font-size:13.5px;width:100%;
  border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:#fff;color:var(--ink)}
textarea{min-height:76px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line2);vertical-align:middle}
th{color:var(--ink2);font-weight:600;background:#fafbfd;white-space:nowrap}
tbody tr:hover{background:#fcfdff}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
.pill.draft{background:#eef1f6;color:var(--ink2)}
.pill.open{background:var(--ok-soft);color:var(--ok)}
.pill.closed{background:var(--warn-soft);color:var(--warn)}
.pill.none{background:#f0f2f6;color:var(--ink3)}
.pill.sub{background:var(--ok-soft);color:var(--ok)}
.pill.part{background:var(--warn-soft);color:var(--warn)}

/* ---- 설문 응답 ---- */
.qblock{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;
  margin-bottom:12px;background:#fff}
.qblock.tool{border-left:3px solid var(--accent)}
.qblock.miss{border-color:var(--bad);background:var(--bad-soft)}
tr.miss{background:var(--bad-soft)}
.qtitle{font-weight:600;margin-bottom:2px}
.qtitle .req{color:var(--bad);margin-left:3px}
.qhelp{color:var(--ink3);font-size:12.5px;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.opts.inline{flex-direction:row;flex-wrap:wrap;gap:6px}
.opt{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:7px;
  padding:7px 11px;background:#fff}
.opt:hover{background:#fafbfd}
.opt input{margin:0;accent-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.awtable th:first-child,.awtable td:first-child{width:38%}
.awtable td.ch{text-align:center;white-space:nowrap}
.awtable .tname{font-weight:600}
.awtable .tdesc{color:var(--ink3);font-size:12px;font-weight:400}
/* ---- 단계별 응답 ---- */
.fhead h1{margin-bottom:4px}
.stepper{display:flex;gap:6px;margin-top:14px}
.stepper .s{flex:1;padding-top:8px;border-top:3px solid #e3e8f0;font-size:12.5px;color:var(--ink3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper .s .no{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;
  background:#e3e8f0;color:var(--ink2);text-align:center;font-size:11px;font-weight:700;margin-right:5px}
.stepper .s.done{border-top-color:#9cc0e6;color:var(--ink2)}
.stepper .s.done .no{background:#9cc0e6;color:#fff}
.stepper .s.cur{border-top-color:var(--accent);color:var(--accent);font-weight:700}
.stepper .s.cur .no{background:var(--accent);color:#fff}
.pickbar{display:flex;align-items:center;gap:10px;margin:2px 0 4px;font-size:13.5px}
.pickbar b{color:var(--accent);font-size:16px}
.catttl{font-size:11.5px;letter-spacing:1.3px;color:var(--ink3);font-weight:700;margin:18px 0 8px;
  text-transform:uppercase}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
.tcard{position:relative;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px 10px;
  background:#fff;cursor:pointer;user-select:none;transition:border-color .12s,box-shadow .12s,background .12s;
  display:flex;flex-direction:column}
.tcard:hover{border-color:#b6c4d9;box-shadow:0 2px 10px rgba(30,50,90,.08)}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tcard.on{border-color:var(--accent);background:#f2f7fe;box-shadow:0 0 0 3px var(--accent-soft)}
.tcard.ro{cursor:default}
.tchk{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;
  border:1.5px solid #c5cfdd;background:#fff;color:transparent;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800}
.tcard.on .tchk{background:var(--accent);border-color:var(--accent);color:#fff}
.thead{display:flex;gap:11px;align-items:center;margin-bottom:8px;padding-right:26px}
.ticon{position:relative;flex:none;width:42px;height:42px;border-radius:10px;display:flex;
  align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.3px}
.ticon svg{width:100%;height:100%;display:block;border-radius:10px}
.ticon .kind{position:absolute;right:-5px;bottom:-5px;font-style:normal;font-size:8.5px;font-weight:800;
  background:#1d2430;color:#fff;border-radius:4px;padding:0 3px;line-height:13px;letter-spacing:0}
.ticon.lg{width:58px;height:58px;font-size:20px;border-radius:13px}
.ticon.lg svg{border-radius:13px}
.ticon.sm{width:34px;height:34px;font-size:12.5px;border-radius:8px}
.ticon.sm svg{border-radius:8px}
.ticon.sm .kind{display:none}
.tnm{font-weight:700;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.thead>div{min-width:0}
.tcat{font-size:11.5px;color:var(--ink3)}
.tds{font-size:12.5px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;
  -webkit-box-orient:vertical;overflow:hidden}
.tds.one{-webkit-line-clamp:1}
.tds.full{display:block;overflow:visible}
.tstate{margin-top:auto;padding-top:8px;font-size:12px;color:var(--ink3)}
.tcard.on .tstate{color:var(--accent);font-weight:700}
.tphead{display:flex;gap:16px;align-items:center}
.tpname{font-size:20px;font-weight:700;line-height:1.3;margin:1px 0 3px}
.qno{display:inline-block;min-width:26px;color:var(--accent);font-weight:800}
.ucard{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px 4px;margin-bottom:12px}
.uhead{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.qblock.compact{border:none;padding:4px 0 8px;margin:0;background:none}
.qblock.compact.miss{background:var(--bad-soft);padding:6px 8px 8px;border-radius:7px}
.donecard{text-align:center;padding:40px 20px}
.donecard .big{width:64px;height:64px;line-height:64px;border-radius:50%;background:var(--ok-soft);
  color:var(--ok);font-size:32px;font-weight:800;margin:0 auto 12px}
.donecard .lead{text-align:center}
.toolhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.toolhead .n{font-weight:700;font-size:14.5px}
.unused-note{background:#fafbfd;border:1px dashed var(--line);border-radius:7px;
  padding:8px 11px;color:var(--ink2);font-size:12.5px;margin-bottom:10px}
.bar{position:relative;background:#eef1f6;border-radius:4px;height:16px;min-width:80px}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);
  border-radius:4px;opacity:.75}
.cnt{white-space:nowrap;font-variant-numeric:tabular-nums}
.sticky-foot{position:fixed;left:0;right:0;bottom:0;background:#fff;
  border-top:1px solid var(--line);z-index:25}
.sticky-foot .in{max-width:1040px;margin:0 auto;padding:10px 18px;display:flex;
  align-items:center;gap:10px}
.prog{flex:1;min-width:120px}
.prog .t{font-size:12px;color:var(--ink2);margin-bottom:3px}
.prog .g{height:6px;background:#eef1f6;border-radius:4px;overflow:hidden}
.prog .g>i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:72px;background:#1d2430;
  color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;opacity:0;
  transition:opacity .18s;pointer-events:none}
.toast.on{opacity:.95}
.note{background:var(--warn-soft);border:1px solid #f0dcbd;color:#7a4a14;
  border-radius:8px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.note.ok{background:var(--ok-soft);border-color:#cfe7d9;color:#1a5f3d}
.note.err{background:var(--bad-soft);border-color:#eccfcf;color:#8e2f2f}
.texts li{margin-bottom:9px;padding-left:2px}
.texts .who{color:var(--accent);font-weight:600;font-size:12.5px}
.texts .tx{white-space:pre-wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi .k{flex:1;min-width:120px;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .k b{display:block;font-size:22px;line-height:1.2}
.kpi .k span{color:var(--ink3);font-size:12px}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;
  background:none;padding:8px 13px;color:var(--ink2)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.editq{border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:9px;
  background:#fdfdfe}
.editq .hd{display:flex;gap:8px;align-items:center;margin-bottom:7px}
.editq .hd select{width:auto}
.f{margin-bottom:8px}
.f label{display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
hr{border:none;border-top:1px solid var(--line2);margin:16px 0}
@media (max-width:760px){
  .grid2{grid-template-columns:1fr}
  .stepper .s{font-size:0}
  .stepper .s .no{font-size:11px;margin:0}
  .stepper .s.cur{font-size:12px}
  .stepper .s.cur .no{margin-right:5px}
  .tgrid{grid-template-columns:1fr;gap:7px}
  .tcard{padding:9px 11px}
  .tcard .thead{margin:0}
  .tcard .tds,.tcard .tstate{display:none}
  .tchk{top:50%;margin-top:-11px}
  .tphead{gap:12px}
  .hide-sm{display:none}
  .awtable th:first-child,.awtable td:first-child{width:auto}
  .awtable{font-size:12px}
  th,td{padding:6px 5px}
}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo">Tool Survey <small>Engineering Hub</small></div>
  <div class="sp"></div>
  <div class="who" id="who"></div>
  <button class="ghost" onclick="go('#/')">목록</button>
</div></header>
<main id="app"><div class="card">불러오는 중…</div></main>
<div class="toast" id="toast"></div>

<script>
'use strict';
var ME = {username:'', display:'', admin:false};
var AW = [];          // 인지도 보기 (서버에서 받음)
var state = {};

/* ------------------------------------------------------------------ 공통 */
function h(s){ return String(s==null?'':s).replace(/[&<>"']/g,
  function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); }); }
function el(id){ return document.getElementById(id); }
function toast(m){ var t=el('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('on');},2200); }
function go(hash){ if(location.hash===hash){ render(); } else { location.hash=hash; } }
function fmt(ts){ if(!ts) return '-'; var d=new Date(ts*1000);
  function p(n){ return (n<10?'0':'')+n; }
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function pct(n,d){ return d>0 ? Math.round(n*100/d) : 0; }
/* 응답률: Hub 계정보다 응답이 많아지는 상황(계정 정리 전 등)에서도 100%를 넘기지 않는다 */
function rate(n,d){ return Math.min(100, pct(n,d)); }

function api(path, opt){
  opt = opt || {};
  return fetch(path, {method:opt.method||'GET',
      headers:{'Content-Type':'application/json'},
      body:opt.body?JSON.stringify(opt.body):undefined})
    .then(function(r){
      return r.json().catch(function(){ return {error:'응답을 해석할 수 없습니다.'}; })
        .then(function(j){
          if(!r.ok){ var e=new Error(j.error||('HTTP '+r.status)); e.data=j; throw e; }
          return j; });
    });
}

/* ------------------------------------------------------------------ 라우팅 */
window.addEventListener('hashchange', render);
api('/api/me').then(function(me){
  ME=me;
  el('who').innerHTML = h(me.display)+(me.admin?'<span class="badge">관리자</span>':'');
  render();
}).catch(function(){
  el('app').innerHTML = '<div class="card"><h2>로그인이 필요합니다</h2>'+
    '<p class="lead">Engineering Hub 포털에서 <b>Tool Survey</b> 카드를 눌러 들어오세요.\n'+
    '포털 주소: <a href="/">http://&lt;서버IP&gt;:8080</a></p></div>';
});

function render(){
  var hash = location.hash || '#/';
  var m;
  if(hash!=='#/') firstList = false;
  var f=el('foot'); if(f) f.remove();   // 응답 화면 하단 바가 다른 화면에 남지 않게
  if((m=hash.match(/^#\/survey\/(\d+)$/))) return viewFill(+m[1]);
  if((m=hash.match(/^#\/results\/(\d+)$/))) return viewResults(+m[1]);
  if((m=hash.match(/^#\/edit\/(\d+)$/)))    return viewEdit(+m[1]);
  if((m=hash.match(/^#\/one\/(\d+)\/(.+)$/))) return viewOne(+m[1], decodeURIComponent(m[2]));
  return viewList();
}

/* ================================================================= 목록 */
var firstList = true;   // Hub 에서 처음 들어왔을 때만 진행중 설문으로 바로 보낸다
function viewList(){
  api('/api/surveys').then(function(d){
    var open = d.surveys.filter(function(s){ return s.status==='open'; });
    if(firstList && !ME.admin && open.length===1 && open[0].myState!=='submitted'){
      firstList = false;
      return go('#/survey/'+open[0].id);
    }
    firstList = false;
    var rows = d.surveys.map(function(s){
      var my = {none:'<span class="pill none">미응답</span>',
                draft:'<span class="pill part">작성중</span>',
                submitted:'<span class="pill sub">제출완료</span>'}[s.myState];
      var st = {draft:'<span class="pill draft">작성중(비공개)</span>',
                open:'<span class="pill open">진행중</span>',
                closed:'<span class="pill closed">종료</span>'}[s.status];
      var btns = '';
      if(s.status==='open') btns += '<button class="primary" onclick="go(\'#/survey/'+s.id+'\')">'+
          (s.myState==='submitted'?'내 응답 수정':'응답하기')+'</button> ';
      if(s.status!=='open' && s.myState!=='none')
        btns += '<button onclick="go(\'#/survey/'+s.id+'\')">내 응답 보기</button> ';
      if(ME.admin || s.showResults)
        btns += '<button onclick="go(\'#/results/'+s.id+'\')">결과 보기</button> ';
      if(ME.admin) btns += '<button onclick="go(\'#/edit/'+s.id+'\')">설문 편집</button>';
      return '<tr><td><b>'+h(s.title)+'</b><div class="muted">'+st+
        (s.anonymous?' · 익명':'')+'</div></td>'+
        '<td class="cnt">'+s.responses+' / '+d.hubUsers+'<div class="muted">'+
        rate(s.responses,d.hubUsers)+'%</div></td>'+
        '<td>'+my+'</td><td class="right">'+btns+'</td></tr>';
    }).join('');
    el('app').innerHTML =
      '<div class="card"><div class="row"><h1 style="margin:0">설문 목록</h1>'+
      (ME.admin?'<button class="primary right" onclick="newSurvey()">+ 새 설문 만들기</button>':'')+
      '</div></div>'+
      '<div class="card">'+(rows?
        '<table><thead><tr><th>설문</th><th>응답</th><th>내 상태</th><th></th></tr></thead>'+
        '<tbody>'+rows+'</tbody></table>'
        :'<p class="lead">진행 중인 설문이 없습니다.</p>')+'</div>';
  }).catch(err);
}
function err(e){ el('app').innerHTML='<div class="card"><div class="note err">'+h(e.message)+
  '</div><button onclick="go(\'#/\')">목록으로</button></div>'; }

function newSurvey(){
  var t = prompt('설문 제목을 입력하세요', '팀 공용 툴 사용 현황 및 개선 의견 조사');
  if(!t) return;
  api('/api/surveys',{method:'POST',body:{title:t}}).then(function(r){
    go('#/edit/'+r.id); }).catch(function(e){ toast(e.message); });
}

/* ======================================================= 응답 화면 (단계별)
   구글 폼처럼 한 화면에 한 단계씩 진행한다.
     1) 툴 선택   : Hub 카드 모양 그대로, 써본 툴을 눌러서 고른다
     2) 써본 툴   : 고른 툴마다 한 화면씩 평가 (사용 빈도 + usedQuestions)
     3) 안 써본 툴: 나머지 툴을 한 화면에 모아 짧게 (unusedQuestions)
     4) 공통 문항 : commonQuestions
   서버에 저장하는 answers 형식(awareness/tools/common)은 그대로이고,
   카드 선택 목록만 answers.picked 에 함께 저장해 다시 열어도 유지되게 한다. */
var USED_FREQ = [{value:'often', label:'자주 쓴다'}, {value:'tried', label:'몇 번 써봤다'}];
var UNKNOWN_OPT = '이런 툴이 있는지 몰랐다';   // 안 써본 이유에서 이걸 고르면 '처음 들어본다'로 집계

function viewFill(sid){
  api('/api/surveys/'+sid).then(function(d){
    AW = d.awarenessOptions;
    var a = (d.myResponse&&d.myResponse.answers)||{};
    a.awareness = a.awareness||{};
    a.tools = a.tools||{};
    a.common = a.common||{};
    var tools = d.survey.schema.tools||[];
    if(!Array.isArray(a.picked))
      a.picked = tools.filter(function(t){ return usedVal(a.awareness[t.id]); })
                      .map(function(t){ return t.id; });
    state = {sid:sid, s:d.survey, a:a, submitted:!!(d.myResponse&&d.myResponse.submitted),
             readonly:d.survey.status!=='open', missing:{}, step:0, done:false};
    drawFill();
  }).catch(err);
}

function usedVal(v){ for(var i=0;i<AW.length;i++) if(AW[i].value===v) return AW[i].used; return false; }
function isPicked(tid){ return state.a.picked.indexOf(tid)>=0; }
function pickedTools(){ return (state.s.schema.tools||[]).filter(function(t){ return isPicked(t.id); }); }
function unpickedTools(){ return (state.s.schema.tools||[]).filter(function(t){ return !isPicked(t.id); }); }
function isEmpty(v){ return v===undefined || v===null || v==='' || (Array.isArray(v)&&!v.length); }

/* 조건부 문항: q.when = {q:'help', in:[...]} 이면 그 답일 때만 보인다 */
function visibleQs(qs, bag){
  return (qs||[]).filter(function(q){
    if(!q.when) return true;
    var v = bag[q.when.q];
    return !isEmpty(v) && (q.when['in']||[]).indexOf(v)>=0;
  });
}
function mustAnswer(q){ return q.required || (q.when && q.requireShown); }

function steps(){
  var sc = state.s.schema, list = [{k:'pick', stage:0}];
  var used = pickedTools();
  used.forEach(function(t, i){ list.push({k:'tool', t:t, i:i+1, n:used.length, stage:1}); });
  if(unpickedTools().length && (sc.unusedQuestions||[]).length) list.push({k:'unused', stage:2});
  if((sc.commonQuestions||[]).length) list.push({k:'common', stage:3});
  return list;
}

/* 안 써본 툴의 인지도 값은 '안 써본 이유' 답으로 정한다 (별도 질문 없이) */
function syncUnusedAw(tid){
  var why = (state.a.tools[tid]||{}).why || [];
  state.a.awareness[tid] = why.indexOf(UNKNOWN_OPT)>=0 ? 'unknown' : 'heard';
}
function ensureAwareness(){
  unpickedTools().forEach(function(t){ syncUnusedAw(t.id); });
  pickedTools().forEach(function(t){
    if(!usedVal(state.a.awareness[t.id])) delete state.a.awareness[t.id]; });
}

function abbrOf(name){
  var w = String(name||'?').replace(/[^\w가-힣 ]/g,' ').split(/\s+/).filter(Boolean);
  return (w.length>1 ? w[0].charAt(0)+w[1].charAt(0) : (w[0]||'?').slice(0,2)).toUpperCase();
}
function colorOf(t){
  if(/^#[0-9a-f]{3,8}$/i.test(t.color||'')) return t.color;
  var n=0; String(t.id).split('').forEach(function(c){ n+=c.charCodeAt(0); });
  return ICON_COLORS[n % ICON_COLORS.length];
}
function iconHtml(t, cls){

  return '<span class="ticon '+(cls||'')+'"'+(svg?'':' style="background:'+colorOf(t)+'"')+'>'+

    (t.kind?'<i class="kind">'+h(t.kind)+'</i>':'')+'</span>';
}

/* ---------------------------------------------------------- 그리기 */
var STAGES = ['써본 툴 선택', '써본 툴 평가', '안 써본 툴', 'Hub 전반'];

function drawFill(){
  if(state.done) return drawDone();
  var st = steps();
  if(state.step >= st.length) state.step = st.length-1;
  var cur = st[state.step], s = state.s, ro = state.readonly;

  var html = '<div class="card fhead">';
  if(cur.k==='pick'){
    html += '<h1>'+h(s.title)+'</h1><p class="lead">'+h(s.intro)+'</p>'+
      '<div class="muted">응답자: <b>'+h(ME.display)+'</b>'+
      (s.anonymous?' · 결과는 <b>익명</b>으로 집계됩니다.':' · 결과에 이름이 함께 표시됩니다.')+'</div>';
  } else {
    html += '<div class="muted">'+h(s.title)+'</div>';
  }
  html += '<div class="stepper">'+STAGES.map(function(lb, i){
      var c = i<cur.stage ? 'done' : i===cur.stage ? 'cur' : '';
      var extra = (i===1 && cur.k==='tool') ? ' '+cur.i+'/'+cur.n : '';
      return '<div class="s '+c+'"><span class="no">'+(i+1)+'</span>'+h(lb)+extra+'</div>';
    }).join('')+'</div></div>';

  if(ro) html += '<div class="note">이 설문은 '+
    (s.status==='closed'?'종료되었습니다':'아직 공개되지 않았습니다')+
    '. 내용만 확인할 수 있고 수정은 되지 않습니다.</div>';
  else if(state.submitted && cur.k==='pick') html += '<div class="note ok">이미 제출하셨습니다. '+
    '내용을 고치고 다시 제출하면 덮어씁니다.</div>';

  if(cur.k==='pick') html += drawPick();
  else if(cur.k==='tool') html += drawToolStep(cur);
  else if(cur.k==='unused') html += drawUnused();
  else html += drawCommon();

  el('app').innerHTML = html;
  drawFoot();
}

function drawPick(){
  var sc=state.s.schema, ro=state.readonly, tools=sc.tools||[];
  var cats=[], by={};
  tools.forEach(function(t){
    var c = t.cat||'기타';
    if(!by[c]){ by[c]=[]; cats.push(c); }
    by[c].push(t);
  });
  var html = '<div class="card"><h2>'+h(sc.awarenessLabel||'사용해 본 툴을 모두 선택해 주세요')+'</h2>'+
    '<div class="qhelp">'+h(sc.awarenessHelp||'')+'</div>'+
    '<div class="pickbar"><span>선택한 툴 <b id="pickN">'+state.a.picked.length+'</b>개'+
    ' <span class="muted">/ 전체 '+tools.length+'개</span></span></div>';
  cats.forEach(function(c){
    html += '<div class="catttl">'+h(c)+'</div><div class="tgrid">'+
      by[c].map(function(t){
        var on = isPicked(t.id);
        return '<div class="tcard'+(on?' on':'')+(ro?' ro':'')+'" role="checkbox" tabindex="0"'+
          ' aria-checked="'+on+'" data-tid="'+h(t.id)+'"'+
          (ro?'':' onclick="togglePick(this)" onkeydown="if(event.key===\' \'||event.key===\'Enter\'){event.preventDefault();togglePick(this);}"')+'>'+
          '<span class="tchk">&#10003;</span>'+
          '<div class="thead">'+iconHtml(t)+'<div><div class="tnm">'+h(t.name)+'</div>'+
          '<div class="tcat">'+h(c)+'</div></div></div>'+
          (t.desc?'<div class="tds">'+h(t.desc)+'</div>':'')+
          '<div class="tstate">'+(on?'&#10003; 사용해 봤어요':'눌러서 선택')+'</div></div>';
      }).join('')+'</div>';
  });
  return html+'</div>';
}

function togglePick(node){
  var tid = node.getAttribute('data-tid'), p = state.a.picked, i = p.indexOf(tid);
  if(i>=0){ p.splice(i,1); syncUnusedAw(tid); }
  else { p.push(tid); if(!usedVal(state.a.awareness[tid])) delete state.a.awareness[tid]; }
  var on = i<0;
  node.classList.toggle('on', on);
  node.setAttribute('aria-checked', on);
  node.querySelector('.tstate').innerHTML = on ? '&#10003; 사용해 봤어요' : '눌러서 선택';
  el('pickN').textContent = p.length;
  queueSave();
  drawFoot();
}

function drawToolStep(cur){
  var t=cur.t, sc=state.s.schema, ro=state.readonly, a=state.a;
  var bag = a.tools[t.id] = a.tools[t.id]||{};
  var aw = a.awareness[t.id], key='awareness:'+t.id;
  var html = '<div class="card tphead">'+iconHtml(t,'lg')+'<div>'+
    '<div class="muted">써본 툴 평가 · '+cur.i+' / '+cur.n+'</div>'+
    '<div class="tpname">'+h(t.name)+'</div>'+
    (t.desc?'<div class="tds full">'+h(t.desc)+'</div>':'')+'</div></div>';
  html += '<div class="card">';
  html += '<div class="qblock'+(state.missing[key]?' miss':'')+'" id="q_'+h(key.replace(/[^\w]/g,'_'))+'">'+
    '<div class="qtitle">이 툴을 얼마나 사용하시나요?<span class="req">*</span></div>'+
    '<div class="opts inline">'+USED_FREQ.map(function(o){
      var on = aw===o.value;
      return '<label class="opt'+(on?' on':'')+'"><input type="radio" name="'+h(key)+'"'+
        (on?' checked':'')+(ro?' disabled':'')+' onchange="setFreq(\''+h(t.id)+'\',\''+o.value+'\')">'+
        '<span>'+h(o.label)+'</span></label>';
    }).join('')+'</div></div>';
  visibleQs(sc.usedQuestions, bag).forEach(function(q, qi){
    html += field(q, bag[q.id], 'tool:'+t.id+':'+q.id, 'Q'+(qi+1), ro);
  });
  return html+'</div>';
}

function setFreq(tid, v){
  state.a.awareness[tid] = v;
  delete state.missing['awareness:'+tid];
  var b = el('q_awareness_'+tid.replace(/[^\w]/g,'_'));
  if(b){ b.classList.remove('miss');
    Array.prototype.forEach.call(b.querySelectorAll('.opt'), function(l){
      l.classList.toggle('on', l.querySelector('input').checked); }); }
  queueSave();
}

function drawUnused(){
  var sc=state.s.schema, ro=state.readonly, a=state.a, list=unpickedTools();
  var html = '<div class="card"><h2>사용해 보지 않은 툴 ('+list.length+'개)</h2>'+
    '<div class="qhelp">툴마다 두 가지만 짧게 여쭙니다. 해당되는 것만 골라주시면 됩니다.</div>';
  list.forEach(function(t){
    var bag = a.tools[t.id] = a.tools[t.id]||{};
    html += '<div class="ucard"><div class="uhead">'+iconHtml(t,'sm')+
      '<div><div class="tnm">'+h(t.name)+'</div>'+
      (t.desc?'<div class="tds one">'+h(t.desc)+'</div>':'')+'</div></div>';
    visibleQs(sc.unusedQuestions, bag).forEach(function(q, qi){
      html += field(q, bag[q.id], 'tool:'+t.id+':'+q.id, 'Q'+(qi+1), ro, null, true);
    });
    html += '</div>';
  });
  return html+'</div>';
}

function drawCommon(){
  var sc=state.s.schema, ro=state.readonly;
  var html = '<div class="card"><h2>마지막으로, Hub 전반에 대해 여쭙니다</h2>';
  (sc.commonQuestions||[]).forEach(function(q, i){
    html += field(q, state.a.common[q.id], 'common:'+q.id, 'Q'+(i+1), ro, sc.tools);
  });
  return html+'</div>';
}

function drawDone(){
  var n = pickedTools().length;
  el('app').innerHTML = '<div class="card donecard"><div class="big">&#10003;</div>'+
    '<h1>제출되었습니다. 감사합니다!</h1>'+
    '<p class="lead">써본 툴 '+n+'개에 대한 평가와 의견이 잘 저장되었습니다.\n'+
    '설문이 진행 중인 동안에는 언제든 다시 들어와 고칠 수 있습니다.</p>'+
    '<div class="row" style="justify-content:center;margin-top:14px">'+
    '<button onclick="state.done=false;state.step=0;drawFill();scrollTo(0,0)">응답 수정하기</button>'+
    '<button class="primary" onclick="go(\'#/\')">목록으로</button></div></div>';
  var f=el('foot'); if(f) f.remove();
}

function inlineOk(opts){
  opts = opts || [];
  if(!opts.length || opts.length > 6) return false;
  for(var i=0;i<opts.length;i++) if(String(opts[i]).length > 13) return false;
  return true;
}

function field(q, val, key, num, ro, tools, chips){
  var bad = state.missing[key];
  var h2 = '<div class="qblock'+(bad?' miss':'')+(chips?' compact':'')+'" id="q_'+
    h(key.replace(/[^\w]/g,'_'))+'">'+
    '<div class="qtitle"><span class="qno">'+h(num)+'</span>'+h(q.label)+
    (mustAnswer(q)?'<span class="req">*</span>':'')+'</div>';
  if(q.help) h2 += '<div class="qhelp">'+h(q.help)+'</div>';
  var dis = ro?' disabled':'';
  if(q.type==='single' || q.type==='multi'){
    var multi = q.type==='multi';
    var cur = multi ? (val||[]) : val;
    // 복수 선택은 칩 모양으로 흘려 배치해 세로로 길어지지 않게 한다
    h2 += '<div class="opts'+((chips||multi||inlineOk(q.options))?' inline':'')+'">'+
      (q.options||[]).map(function(o){
        var on = multi ? cur.indexOf(o)>=0 : cur===o;
        return '<label class="opt'+(on?' on':'')+'"><input type="'+(multi?'checkbox':'radio')+
          '" name="'+h(key)+'" '+(on?'checked ':'')+dis+
          ' onchange="setVal(\''+h(key)+'\',this,'+(multi?'true':'false')+
          ',\''+h(o).replace(/'/g,"\\'")+'\')"><span>'+h(o)+'</span></label>';
      }).join('')+'</div>';
  } else if(q.type==='toolpick'){
    h2 += '<div class="opts inline">'+(tools||[]).map(function(t){
      return '<label class="opt'+(val===t.id?' on':'')+'"><input type="radio" name="'+h(key)+
        '" '+(val===t.id?'checked ':'')+dis+' onchange="setVal(\''+h(key)+
        '\',this,false,\''+h(t.id)+'\')"><span>'+h(t.name)+'</span></label>';
    }).join('')+'</div>';
  } else {
    h2 += '<textarea '+dis+' placeholder="'+h(q.placeholder||'')+
      '" oninput="setVal(\''+h(key)+'\',this,false,null)">'+h(val||'')+'</textarea>';
  }
  return h2+'</div>';
}

function setVal(key, node, multi, optval){
  var p = key.split(':');
  var bag = p[0]==='common' ? state.a.common : (state.a.tools[p[1]] = state.a.tools[p[1]]||{});
  var id = p[0]==='common' ? p[1] : p[2];
  if(multi){
    var arr = bag[id]||[];
    var i = arr.indexOf(optval);
    if(node.checked){ if(i<0) arr.push(optval); } else if(i>=0) arr.splice(i,1);
    bag[id]=arr;
  } else if(optval!==null){ bag[id]=optval; }
  else { bag[id]=node.value; }
  delete state.missing[key];
  if(p[0]==='tool' && id==='why' && !isPicked(p[1])) syncUnusedAw(p[1]);
  // 이 답에 따라 보였다 숨었다 하는 문항이 있으면 화면을 다시 그린다
  var qs = p[0]==='common' ? state.s.schema.commonQuestions
         : isPicked(p[1]) ? state.s.schema.usedQuestions : state.s.schema.unusedQuestions;
  var dep = (qs||[]).filter(function(q){ return q.when && q.when.q===id; });
  if(dep.length){
    var vis = visibleQs(dep, bag);
    dep.forEach(function(q){ if(vis.indexOf(q)<0) delete bag[q.id]; });
    queueSave();
    return drawFill();
  }
  // 라디오/체크박스는 선택 표시를 즉시 반영한다 (서술형은 커서를 잃지 않도록 두고 본다)
  if(optval!==null){
    var box = node.closest('.opts');
    if(box) Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(l){
      l.classList.toggle('on', l.querySelector('input').checked); });
    var qb = node.closest('.qblock'); if(qb) qb.classList.remove('miss');
  }
  queueSave();
}
function queueSave(){
  if(state.readonly) return;
  clearTimeout(setVal._t);
  setVal._t = setTimeout(function(){ save(false, true); }, 1200);
}

/* ---------------------------------------------------------- 단계 이동 */
function stepMissing(stp){
  var sc=state.s.schema, a=state.a, miss=[];
  function chk(qs, bag, pre){
    visibleQs(qs, bag).forEach(function(q){
      if(mustAnswer(q) && isEmpty(bag[q.id])) miss.push(pre+q.id); });
  }
  if(stp.k==='tool'){
    if(!usedVal(a.awareness[stp.t.id])) miss.push('awareness:'+stp.t.id);
    chk(sc.usedQuestions, a.tools[stp.t.id]||{}, 'tool:'+stp.t.id+':');
  } else if(stp.k==='unused'){
    unpickedTools().forEach(function(t){ chk(sc.unusedQuestions, a.tools[t.id]||{}, 'tool:'+t.id+':'); });
  } else if(stp.k==='common'){
    chk(sc.commonQuestions, a.common, 'common:');
  }
  return miss;
}
function showMissing(miss){
  state.missing={}; miss.forEach(function(k){ state.missing[k]=true; });
  drawFill();
  toast('빨간색으로 표시된 필수 문항을 채워주세요. ('+miss.length+'개)');
  var first=document.querySelector('.miss');
  if(first) first.scrollIntoView({behavior:'smooth',block:'center'});
}
function stepOfKey(k){
  var p=k.split(':'), st=steps();
  for(var i=0;i<st.length;i++){
    if(p[0]==='common' && st[i].k==='common') return i;
    if(p[0]!=='common' && st[i].k==='tool' && st[i].t.id===p[1]) return i;
    if(p[0]==='tool' && st[i].k==='unused' && !isPicked(p[1])) return i;
  }
  return 0;
}
function goStep(i){
  state.step=i; state.missing={};
  drawFill(); scrollTo(0,0);
}
function nextStep(){
  var st=steps(), cur=st[state.step];
  if(!state.readonly){
    var miss=stepMissing(cur);
    if(miss.length) return showMissing(miss);
    if(cur.k==='pick'){
      if(!state.a.picked.length &&
         !confirm('사용해 본 툴을 하나도 선택하지 않으셨습니다.\n이대로 다음으로 넘어갈까요?')) return;
      ensureAwareness();
    }
    clearTimeout(setVal._t); save(false, true);
  }
  goStep(Math.min(state.step+1, st.length-1));
}
function prevStep(){ if(state.step>0) goStep(state.step-1); }

function submitAll(){
  ensureAwareness();
  var st=steps();
  for(var i=0;i<st.length;i++){
    var miss=stepMissing(st[i]);
    if(miss.length){ state.step=i; return showMissing(miss); }
  }
  // 써본/안 써본 그룹이 바뀐 툴은 반대쪽 그룹의 답을 지워 CSV 에 섞이지 않게 한다
  var sc=state.s.schema;
  (sc.tools||[]).forEach(function(t){
    var bag=state.a.tools[t.id]; if(!bag) return;
    var keep=(isPicked(t.id)?sc.usedQuestions:sc.unusedQuestions)||[];
    var ids=keep.map(function(q){ return q.id; });
    Object.keys(bag).forEach(function(k){ if(ids.indexOf(k)<0) delete bag[k]; });
  });
  save(true);
}

function drawFoot(){
  var old=el('foot'); if(old) old.remove();
  if(state.done) return;
  var st=steps(), i=state.step, last=i>=st.length-1, ro=state.readonly;
  var d=document.createElement('div');
  d.className='sticky-foot'; d.id='foot';
  d.innerHTML='<div class="in">'+
    '<button onclick="prevStep()"'+(i===0?' disabled':'')+'>&larr; 이전</button>'+
    '<div class="prog"><div class="t">'+(i+1)+' / '+st.length+' 단계'+
    '<span id="savedAt" class="muted"></span></div><div class="g"><i style="width:'+
    pct(i+1,st.length)+'%"></i></div></div>'+
    (ro?'':'<button class="hide-sm" onclick="save(false)">임시저장</button>')+
    (last ? (ro?'':'<button class="primary" onclick="submitAll()">'+
              (state.submitted?'수정 제출':'제출하기')+'</button>')
          : '<button class="primary" onclick="nextStep()">다음 &rarr;</button>')+
    '</div>';
  document.body.appendChild(d);
}

function save(submit, quiet){
  if(submit) clearTimeout(setVal._t);   // 마지막 입력 직후 제출해도 늦게 도는 자동저장이 '제출'을 덮어쓰지 않게
  return api('/api/surveys/'+state.sid+'/response',
             {method:'POST', body:{answers:state.a, submitted:!!submit}})
  .then(function(){
    if(submit){ state.submitted=true; state.done=true; state.missing={};
      drawFill(); scrollTo(0,0); }
    else if(!quiet) toast('임시저장했습니다.');
    else { var s=el('savedAt'); if(s) s.textContent=' · 자동저장 '+fmt(Date.now()/1000); }
  })
  .catch(function(e){
    if(e.data && e.data.missing && e.data.missing.length){
      state.step = stepOfKey(e.data.missing[0]);
      showMissing(e.data.missing);
    } else if(!quiet) toast(e.message);
  });
}

function barRow(label, n, total){
  return '<tr><td>'+h(label)+'</td><td style="width:45%"><div class="bar"><i style="width:'+
    pct(n,total)+'%"></i></div></td><td class="cnt">'+n+'명 ('+pct(n,total)+'%)</td></tr>';
}
function countTable(obj, total){
  var keys=Object.keys(obj);
  if(!keys.length) return '<p class="muted">-</p>';
  return '<table>'+keys.map(function(k){ return barRow(k, obj[k], total); }).join('')+'</table>';
}

/* 생산성 문항(id: prod)의 보기를 주당 분(分)으로 환산해 툴별 절감 시간을 추정한다.
   "2시간 이상"은 하한값(120분)으로 계산하므로 합계는 최소 추정치다. */
var PROD_MIN = {'도움 안 됨':0, '약 10분':10, '약 30분':30, '약 1시간':60, '약 2시간 이상':120};
function prodTable(sc, agg){
  var rows='';
  (sc.tools||[]).forEach(function(t){
    var c=((agg.tools[t.id]||{}).used||{}).prod; if(!c) return;
    var n=0, min=0;
    Object.keys(c).forEach(function(k){
      if(PROD_MIN[k]===undefined) return; n+=c[k]; min+=c[k]*PROD_MIN[k]; });
    if(!n) return;
    rows += '<tr><td><b>'+h(t.name)+'</b></td><td class="cnt">'+n+'명</td>'+
      '<td class="cnt">'+Math.round(min/n)+'분</td>'+
      '<td class="cnt"><b>'+(Math.round(min/6)/10)+'시간</b></td></tr>';
  });
  if(!rows) return '';
  return '<h3>툴별 생산성 향상 (주당, 추정)</h3><table><thead><tr><th>툴</th>'+
    '<th class="cnt">응답</th><th class="cnt">1인 평균 절감</th>'+
    '<th class="cnt">응답자 합계 절감</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="muted" style="margin-top:6px">보기를 10분·30분·60분·120분으로 환산한 값입니다. '+
    '"약 2시간 이상"은 120분으로 계산해 실제보다 작게 잡힐 수 있습니다.</div>';
}

  var body='';

  else if(state.tab==='sum'){
    body += '<h3>툴 인지도 / 사용 현황</h3><table><thead><tr><th>툴</th>'+
      AW.map(function(o){ return '<th class="cnt">'+h(o.label)+'</th>'; }).join('')+

    (sc.tools||[]).forEach(function(t){
      var c=agg.awareness[t.id]||{};
      var used=0; AW.forEach(function(o){ if(o.used) used+=(c[o.value]||0); });
      body += '<tr><td><b>'+h(t.name)+'</b></td>'+
        AW.map(function(o){ return '<td class="cnt">'+(c[o.value]||0)+'</td>'; }).join('')+
        '<td class="cnt"><b>'+pct(used,T)+'%</b></td></tr>';
    });
    body += '</tbody></table>';
    body += prodTable(sc, agg);
    (sc.commonQuestions||[]).forEach(function(q){
      if(q.type==='textarea') return;
      body += '<h3>'+h(q.label)+'</h3>'+countTable(agg.common[q.id]||{}, T);
    });
  }
  else if(state.tab==='tool'){
    (sc.tools||[]).forEach(function(t){
      var pt=agg.tools[t.id]||{used:{},unused:{},texts:{}};
      var c=agg.awareness[t.id]||{};
      var used=0; AW.forEach(function(o){ if(o.used) used+=(c[o.value]||0); });
      body += '<div class="qblock tool"><div class="toolhead"><span class="n">'+h(t.name)+
        '</span><span class="muted">사용 경험 '+used+'명 / '+T+'명</span></div>';
      (sc.usedQuestions||[]).forEach(function(q){
        if(q.type==='textarea') return;
        body += '<h3>'+h(q.label)+'</h3>'+countTable(pt.used[q.id]||{}, used||1);
      });
      (sc.unusedQuestions||[]).forEach(function(q){
        if(q.type==='textarea') return;
        var any=pt.unused[q.id]||{}; var sum=0;
        Object.keys(any).forEach(function(k){ sum+=any[k]; });
        if(!sum) return;
        body += '<h3 style="color:var(--ink2)">[안 쓰는 분] '+h(q.label)+'</h3>'+
          countTable(any, T-used||1);
      });
      var tx=[];
      Object.keys(pt.texts||{}).forEach(function(qid){
        (pt.texts[qid]||[]).forEach(function(o){ tx.push(o); }); });
      if(tx.length) body += '<h3>개선 의견 ('+tx.length+'건)</h3><ul class="texts">'+
        tx.map(function(o){ return '<li><span class="who">'+h(o.who)+
          '</span><div class="tx">'+h(o.text)+'</div></li>'; }).join('')+'</ul>';
      body += '</div>';
    });
  }
  else if(state.tab==='open'){
    var any=false;
    (sc.tools||[]).forEach(function(t){
      var pt=agg.tools[t.id]||{texts:{}};
      Object.keys(pt.texts||{}).forEach(function(qid){
        var list=pt.texts[qid]||[]; if(!list.length) return; any=true;
        body += '<h3>'+h(t.name)+' — 개선 의견</h3><ul class="texts">'+
          list.map(function(o){ return '<li><span class="who">'+h(o.who)+
            '</span><div class="tx">'+h(o.text)+'</div></li>'; }).join('')+'</ul>';
      });
    });
    (sc.commonQuestions||[]).forEach(function(q){
      if(q.type!=='textarea') return;
      var list=agg.common[q.id]||[]; if(!list.length) return; any=true;
      body += '<h3>'+h(q.label)+' ('+list.length+'건)</h3><ul class="texts">'+
        list.map(function(o){ return '<li><span class="who">'+h(o.who)+
          '</span><div class="tx">'+h(o.text)+'</div></li>'; }).join('')+'</ul>';
    });
    if(!any) body='<p class="muted">서술형 응답이 아직 없습니다.</p>';
  }
  else {
    body += '<h3>제출 ('+d.respondents.length+'명)</h3><table><thead><tr><th>이름</th>'+
      '<th>제출시각</th><th></th></tr></thead><tbody>'+
      d.respondents.map(function(r){ return '<tr><td>'+h(r.who)+'</td><td>'+fmt(r.at)+'</td>'+
        '<td class="right">'+(d.admin&&r.username?'<button class="ghost" onclick="go(\'#/one/'+
        state.sid+'/'+encodeURIComponent(r.username)+'\')">응답 보기</button>':'')+
        '</td></tr>'; }).join('')+'</tbody></table>';
    if(d.pending.length) body += '<h3>미응답 ('+d.pending.length+'명)</h3><table><tbody>'+
      d.pending.map(function(p){ return '<tr><td>'+h(p.who)+'</td><td><span class="pill '+
        (p.state==='작성중'?'part':'none')+'">'+h(p.state)+'</span></td></tr>'; }).join('')+
      '</tbody></table>';
  }
  el('app').innerHTML = head + tabs + body + '</div>';
  var f=el('foot'); if(f) f.remove();
}

function viewOne(sid, who){

    var html='<div class="card"><div class="row"><h1 style="margin:0">'+h(d.who)+' 님의 응답</h1>'+
      '<button class="right" onclick="go(\'#/results/'+sid+'\')">결과로 돌아가기</button></div>'+
      '<div class="muted">'+h(d.survey.title)+'</div></div><div class="card">';
    (sc.tools||[]).forEach(function(t){
      var aw=(a.awareness||{})[t.id];
      html += '<div class="qblock tool"><div class="toolhead"><span class="n">'+h(t.name)+

      });
      html += '</div>';
    });
    (sc.commonQuestions||[]).forEach(function(q){
      var v=(a.common||{})[q.id];
      if(v===undefined||v===''||(Array.isArray(v)&&!v.length)) return;
      if(q.type==='toolpick'){ (sc.tools||[]).forEach(function(t){ if(t.id===v) v=t.name; }); }

    var f=el('foot'); if(f) f.remove();
  }).catch(err);
}

var QTYPES=[['single','하나만 선택'],['multi','여러 개 선택'],['textarea','서술형(직접 입력)'],
            ['toolpick','툴 중에서 하나 고르기']];

function qsEditor(group, title, help){
  var list=state.s.schema[group]||[];
  return '<div class="card"><h2>'+h(title)+'</h2><div class="qhelp">'+h(help)+'</div>'+
    list.map(function(q,i){
      var opts = (q.type==='single'||q.type==='multi')
        ? '<div class="f"><label>보기 (한 줄에 하나)</label><textarea oninput="editQ(\''+
          group+'\','+i+',\'options\',this.value)">'+h((q.options||[]).join('\n'))+
          '</textarea></div>' : '';
      var ph = q.type==='textarea'
        ? '<div class="f"><label>입력란 안내문(연필 글씨)</label><input type="text" value="'+
          h(q.placeholder||'')+'" oninput="editQ(\''+group+'\','+i+
          ',\'placeholder\',this.value)"></div>' : '';
      return '<div class="editq"><div class="hd">'+
        '<select onchange="editQ(\''+group+'\','+i+',\'type\',this.value)">'+
        QTYPES.map(function(t){ return '<option value="'+t[0]+'"'+(q.type===t[0]?' selected':'')+
          '>'+t[1]+'</option>'; }).join('')+'</select>'+
        '<label class="opt"><input type="checkbox"'+(q.required?' checked':'')+
          ' onchange="editQ(\''+group+'\','+i+',\'required\',this.checked)"><span>필수</span></label>'+
        '<span class="right"><button class="ghost" onclick="moveQ(\''+group+'\','+i+
          ',-1)">↑</button><button class="ghost" onclick="moveQ(\''+group+'\','+i+
          ',1)">↓</button><button class="danger" onclick="delQ(\''+group+'\','+i+
          ')">삭제</button></span></div>'+
        '<div class="f"><label>질문</label><input type="text" value="'+h(q.label)+
          '" oninput="editQ(\''+group+'\','+i+',\'label\',this.value)"></div>'+
        opts+ph+'</div>';
    }).join('')+
    '<button onclick="addQ(\''+group+'\')">+ 문항 추가</button></div>';
}

function slug(){ return 'q'+Math.random().toString(36).slice(2,8); }
function editTool(i,k,v){ state.s.schema.tools[i][k]=v;
  if(k==='name' && !state.s.schema.tools[i].id) state.s.schema.tools[i].id=slug(); }
function addTool(){ state.s.schema.tools.push({id:slug(),name:'새 툴',desc:''}); drawEdit(); }
function delTool(i){ if(!confirm('이 툴을 문항에서 빼시겠습니까?\n이미 들어온 응답의 해당 항목은 집계에서 제외됩니다.')) return;
  state.s.schema.tools.splice(i,1); drawEdit(); }
function moveTool(i,d){ var a=state.s.schema.tools, j=i+d;
  if(j<0||j>=a.length) return; var t=a[i]; a[i]=a[j]; a[j]=t; drawEdit(); }
function editQ(g,i,k,v){
  if(k==='options') v=v.split('\n').map(function(x){ return x.trim(); }).filter(Boolean);
  state.s.schema[g][i][k]=v;
  if(k==='type') drawEdit();
}
function addQ(g){ state.s.schema[g].push({id:slug(),type:'single',label:'새 질문',
  options:['예','아니오'],required:false}); drawEdit(); }
function delQ(g,i){ state.s.schema[g].splice(i,1); drawEdit(); }
function moveQ(g,i,d){ var a=state.s.schema[g], j=i+d;
  if(j<0||j>=a.length) return; var t=a[i]; a[i]=a[j]; a[j]=t; drawEdit(); }

function saveEdit(){
  var s=state.s;
  s.title=el('e_title').value.trim()||s.title;
  s.intro=el('e_intro').value;
  s.status=el('e_status').value;
  s.anonymous=el('e_anon').checked;
  s.showResults=el('e_show').checked;
  s.schema.awarenessLabel=el('e_awl').value;
  s.schema.awarenessHelp=el('e_awh').value;
  (s.schema.tools||[]).forEach(function(t){ if(!t.id) t.id=slug(); });
  ['usedQuestions','unusedQuestions','commonQuestions'].forEach(function(g){
    (s.schema[g]||[]).forEach(function(q){ if(!q.id) q.id=slug(); }); });
  api('/api/surveys/'+state.sid,{method:'PUT',body:{title:s.title,intro:s.intro,
      status:s.status,anonymous:s.anonymous,showResults:s.showResults,schema:s.schema}})
    .then(function(){ toast('저장했습니다.'+(s.status==='open'?' 팀원이 응답할 수 있습니다.':'')); })
    .catch(function(e){ toast(e.message); });
}
function delSurvey(){
  if(!confirm('설문과 지금까지 들어온 응답을 모두 지웁니다. 되돌릴 수 없습니다.\n계속하시겠습니까?')) return;
  api('/api/surveys/'+state.sid,{method:'DELETE'})
    .then(function(){ go('#/'); }).catch(function(e){ toast(e.message); });
}
</script>
</body>
</html>
